<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galactic Void · Sign in</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070d;color:#e8fbff;font:16px/1.5 system-ui,sans-serif;text-align:center}b{display:block;font-size:20px;letter-spacing:.3em;margin-bottom:8px}p{color:#9aa7c0;margin:0 24px}</style>
<script>window.GV_STANDALONE = true; window.GV_SUPABASE = { url: 'https://egiyumcuuwukhahochiq.supabase.co', key: 'sb_publishable_CdVV4ppF-0NTGGh9WduFLA_oGPn1Tbm' };</script>
<script src="js/vendor/supabase.js"></script>
</head><body><div><b>GALACTIC VOID</b><p id="m">Opening Google sign-in…</p></div>
<script>
{
  const m = document.getElementById('m');
  const cfg = window.GV_SUPABASE;
  if (!cfg || !window.supabase) { m.textContent = 'Sign-in is not set up for this copy of the game.'; }
  else {
    const sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, detectSessionInUrl: true, flowType: 'pkce' } });
    const send = (s) => {
      if (window.opener) { window.opener.postMessage({ gvAuth: { access_token: s.access_token, refresh_token: s.refresh_token } }, location.origin); m.textContent = 'Signed in. You can close this window.'; setTimeout(() => window.close(), 600); }
      else { m.textContent = 'Signed in. Return to the game tab and reload it.'; }
    };
    (async () => {
      const q = new URLSearchParams(location.search);
      if (q.get('start')) {
        const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
        if (error) m.textContent = 'Could not start sign-in: ' + error.message;
        return;
      }
      if (q.get('error')) { m.textContent = 'Sign-in was cancelled or failed: ' + (q.get('error_description') || q.get('error')); return; }
      const { data } = await sb.auth.getSession();
      if (data.session) send(data.session);
      else sb.auth.onAuthStateChange((ev, s) => { if (s) send(s); });
    })();
  }
}
</script></body></html>
